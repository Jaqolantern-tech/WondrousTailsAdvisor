name: Release

on:
  push:
    tags: ['v*']
  workflow_dispatch:
    inputs:
      version:
        description: 'Version to release, like 1.0.0'
        required: true

permissions:
  contents: write

jobs:
  release:
    runs-on: ubuntu-latest
    env:
      DALAMUD_HOME: ${{ github.workspace }}/.dalamud
      PLUGIN: TailsAdvisor

    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Work out version
        id: ver
        shell: bash
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then RAW="${{ inputs.version }}"; else RAW="${GITHUB_REF_NAME}"; fi
          RAW="${RAW#v}"
          IFS=. read -r a b c d <<< "$RAW"
          echo "tag=v${RAW}" >> "$GITHUB_OUTPUT"
          echo "version=${a:-0}.${b:-0}.${c:-0}.${d:-0}" >> "$GITHUB_OUTPUT"

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '10.0.x'

      - name: Download Dalamud
        run: |
          mkdir -p "$DALAMUD_HOME"
          curl -fsSL -o dalamud.zip https://goatcorp.github.io/dalamud-distrib/latest.zip
          unzip -q -o dalamud.zip -d "$DALAMUD_HOME"

      - name: Build
        run: >
          dotnet build "$PLUGIN/$PLUGIN.csproj" -c Release
          -p:Version=${{ steps.ver.outputs.version }}
          -p:RepoUrl=https://github.com/${{ github.repository }}
          -p:EnableWindowsTargeting=true

      - name: Find package
        id: pkg
        run: |
          ZIP=$(find "$PLUGIN/bin" -path '*Release*' -name latest.zip | head -n 1)
          if [ -z "$ZIP" ]; then echo "latest.zip was not produced"; exit 1; fi
          cp "$ZIP" "$RUNNER_TEMP/latest.zip"
          cp "$(dirname "$ZIP")/$PLUGIN.json" "$RUNNER_TEMP/manifest.json"
          cat "$RUNNER_TEMP/manifest.json"

      - name: Publish GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.ver.outputs.tag }}
          name: ${{ steps.ver.outputs.tag }}
          target_commitish: ${{ github.sha }}
          files: ${{ runner.temp }}/latest.zip

      - name: Update repo.json
        env:
          BRANCH: ${{ github.event.repository.default_branch }}
          TAG: ${{ steps.ver.outputs.tag }}
        run: |
          git fetch origin "$BRANCH"
          git checkout -B "$BRANCH" "origin/$BRANCH"

          DL="https://github.com/${{ github.repository }}/releases/download/${TAG}/latest.zip"
          ICON="https://raw.githubusercontent.com/${{ github.repository }}/${BRANCH}/images/icon.png"

          jq --arg dl "$DL" --arg icon "$ICON" --argjson now "$(date +%s)" \
            '[ . + {
                DownloadLinkInstall: $dl,
                DownloadLinkUpdate: $dl,
                DownloadLinkTesting: $dl,
                IconUrl: $icon,
                IsHide: false,
                IsTestingExclusive: false,
                LastUpdate: $now
              } ]' "$RUNNER_TEMP/manifest.json" > repo.json

          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add repo.json
          git commit -m "Update repo.json for ${TAG}" || echo "repo.json unchanged"
          git push origin "$BRANCH"
